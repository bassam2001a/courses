<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b6b5e">
<title>CompTIA A+ — مكتبة كورساتي</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b6b5e'/%3E%3Cpath d='M9 11h14M9 16h14M9 21h9' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="wrap">
  <header class="bar">
    <a class="back" href="index.html">→ الرئيسية</a>
    <h1><span dir="ltr">CompTIA A+</span></h1>
    <p class="sub">كورس سامح رمضان — الدروس بالترتيب زي القائمة الأصلية.</p>
    <div class="progress">
      <div class="top"><span id="cnt">0 من 56 درس</span><span id="pct">0%</span></div>
      <div class="track"><div class="fill" id="fill"></div></div>
    </div>
  </header>

  <div class="notice">الدروس بتفتح على يوتيوب في تاب جديد. ملفات التحميل للأوفلاين هتتضاف هنا أول ما تتوفر.</div>

  <div class="toolbar">
    <input id="q" type="search" placeholder="دوّر على درس…" aria-label="بحث في الدروس">
    <div class="chips">
      <button class="chip" data-f="all" aria-pressed="true" type="button">الكل</button>
      <button class="chip" data-f="todo" aria-pressed="false" type="button">لسه</button>
      <button class="chip" data-f="done" aria-pressed="false" type="button">خلصت</button>
    </div>
    <button class="btn primary" id="cont" type="button">كمّل من أول درس</button>
    <button class="btn" id="export" type="button">تصدير الملاحظات</button>
  </div>

  <ol class="lessons" id="list"></ol>

  <footer>الدروس بتفتح على يوتيوب في تاب جديد. التقدم والملاحظات بيتحفظوا في المتصفح على جهازك.</footer>
</div>
<script src="data/aplus.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
